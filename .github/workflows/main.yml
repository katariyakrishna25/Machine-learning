
name: StudyHours FastAPI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required files
        run: |
          test -f main.py
          test -f requirements.txt
          test -f linearmodel.pkl
          test -f std_dataset.csv

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Test FastAPI application
        run: |
          python -c "import main; assert main.app is not None; print('App loaded successfully')"

      - name: Test API endpoints
        run: |
          python -c "from fastapi.testclient import TestClient; from main import app; client = TestClient(app); r = client.get('/'); assert r.status_code == 200, r.text; print('GET endpoint passed'); r = client.post('/predict', json={'StudyHours': 3.0}); assert r.status_code == 200, r.text; assert 'predictionmarks' in r.json(), r.text; print('Prediction endpoint passed')"
